name: .NET Core Continuous Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ] 

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Restore dependencies
      run: dotnet restore Aethelgard/Aethelgard.slnx

    - name: Build solution
      run: dotnet build Aethelgard/Aethelgard.slnx --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test Aethelgard/Aethelgard.slnx --no-build --verbosity normal